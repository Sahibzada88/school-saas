# Local development only. Production DB is Supabase. No Redis, no workers.
name: school-saas

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school_saas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - pipcache:/root/.cache/pip
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: local-dev-only-insecure-key-change-me
      DEBUG: "True"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/school_saas
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      FRONTEND_ORIGIN: http://localhost:3000
    command: >
      sh -c "pip install -r requirements.txt &&
             python manage.py makemigrations --noinput &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      BACKEND_ORIGIN: http://backend:8000
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  pipcache:
  node_modules:
